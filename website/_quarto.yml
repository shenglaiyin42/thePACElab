project:
  type: website
  output-dir: _site
  post-render:
    - python3 scripts/build-bilingual.py
  render:
    - index.qmd
    - research.qmd
    - posts.qmd
    - post-hpai-waterbirds.qmd
    - people.qmd
    - publications.qmd
    - contact.qmd
  resources:
    - assets
    - navigation-stability-v2.css

website:
  title: "PACE Lab"
  description: "Pathogens, Animal Movement, Changes, and Ecology"
  favicon: assets/favicon.svg
  navbar:
    headroom: false
    logo: assets/logo-concepts/pace-logo-official-v2.png
    logo-alt: "PACE Lab logo"
    title: "PACE Lab"
    background: "#fffdf7"
    foreground: "#171716"
    search: false
    right:
      - text: "Home"
        href: index.html?v=header-20260928
      - text: "Research"
        href: research.html?v=lang-static-20260925
      - text: "Posts"
        href: posts.html
      - text: "Team"
        href: people.html?v=lang-static-20260925
      - text: "Pubs"
        href: publications.html?v=lang-static-20260925
      - text: "Contact"
        href: contact.html?v=lang-static-20260925
  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css:
      - pace-site.css
      - navigation-stability-v4.css
      - posts-v2.css
    toc: false
    highlight-style: none
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#171716">
        <style>
          [data-pace-copy="zh"] { display: none; }
          html[lang="zh-CN"] [data-pace-copy="en"] { display: none; }
          html[lang="zh-CN"] [data-pace-copy="zh"] { display: inline; }
          html:not([lang="zh-CN"]) [data-pace-copy="en"][data-pace-block] { display: block; }
          html[lang="zh-CN"] [data-pace-copy="zh"][data-pace-block] { display: block; }
          /* Chinese-only sizing; preserve English copy and shared layout sizes. */
          html[lang="zh-CN"] [data-pace-copy="zh"] {
            font-size: calc(1em - 1pt);
          }
          html[lang="zh-CN"] :is(h1, h2, h3, h4, h5, h6) > [data-pace-copy="zh"] {
            font-size: 0.8em;
          }
          html[lang="zh-CN"] .menu-text > [data-pace-copy="zh"] {
            font-size: 0.92em;
          }
          /* The unchanged Latin brand name is not Chinese text. */
          html[lang="zh-CN"] .home-simple > h1 > [data-pace-copy="zh"] {
            font-size: inherit;
          }
        </style>
        <script>
          (function () {
            const requested = new URLSearchParams(window.location.search).get("lang");
            let saved = "en";
            try { saved = window.localStorage.getItem("pace-language") || "en"; } catch (_) {}
            const language = requested === "zh" || requested === "en" ? requested : saved;
            const root = document.documentElement;
            root.lang = language === "zh" ? "zh-CN" : "en";
            root.setAttribute("xml:lang", root.lang);
            const title = root.getAttribute("data-pace-title-" + (language === "zh" ? "zh" : "en"));
            if (title) document.title = title;
            try { window.localStorage.setItem("pace-language", language === "zh" ? "zh" : "en"); } catch (_) {}
          })();
        </script>
        <script defer src="assets/js/language-switch.js?v=static-copy-20260925"></script>
        <script>
          window.addEventListener("DOMContentLoaded", function () {
            const navigationVersion = "header-20260928";
            const normalizePath = function (path) {
              return path.endsWith("/index.html")
                ? path.slice(0, -"index.html".length)
                : path;
            };
            const currentPath = normalizePath(window.location.pathname);

            document.querySelectorAll(".navbar-nav .nav-link").forEach(function (link) {
              const linkPath = normalizePath(new URL(link.href, window.location.origin).pathname);
              const isCurrentPage = linkPath === currentPath ||
                (document.body.classList.contains("post-article-body") && linkPath.endsWith("/posts.html"));
              link.classList.toggle("active", isCurrentPage);
              if (isCurrentPage) {
                link.setAttribute("aria-current", "page");
              } else {
                link.removeAttribute("aria-current");
              }
            });

            if (new URLSearchParams(window.location.search).get("v") === navigationVersion) {
              const cleanUrl = new URL(window.location.href);
              cleanUrl.searchParams.delete("v");
              window.history.replaceState({}, "", currentPath + cleanUrl.search + cleanUrl.hash);
            }
          });
        </script>

execute:
  freeze: auto
