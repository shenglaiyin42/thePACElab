project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research.qmd
    - publications.qmd
    - contact.qmd
  resources:
    - assets

website:
  title: "PACE | Shenglai Yin"
  description: "Pathogens, Animal Movement, Changes, and Ecology"
  favicon: assets/favicon.svg
  navbar:
    headroom: false
    logo: assets/logo-concepts/pace-logo-official-v2.png
    logo-alt: "PACE logo"
    title: false
    background: "#fffdf7"
    foreground: "#171716"
    search: false
    right:
      - text: "Home"
        href: index.html?v=nav-20260809-4
      - text: "Research"
        href: research.html?v=nav-20260809-4
      - text: "Pubs"
        href: publications.html?v=nav-20260809-4
      - text: "Contact"
        href: contact.html?v=nav-20260809-4
  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css:
      - pace-site.css
      - navigation-stability-v2.css
    toc: false
    highlight-style: none
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#171716">
        <script>
          window.addEventListener("DOMContentLoaded", function () {
            const navigationVersion = "nav-20260809-4";
            const normalizePath = function (path) {
              return path.endsWith("/index.html")
                ? path.slice(0, -"index.html".length)
                : path;
            };
            const currentPath = normalizePath(window.location.pathname);

            document.querySelectorAll(".navbar-nav .nav-link").forEach(function (link) {
              const linkPath = normalizePath(new URL(link.href, window.location.origin).pathname);
              const isCurrentPage = linkPath === currentPath;
              link.classList.toggle("active", isCurrentPage);
              if (isCurrentPage) {
                link.setAttribute("aria-current", "page");
              } else {
                link.removeAttribute("aria-current");
              }
            });

            if (new URLSearchParams(window.location.search).get("v") === navigationVersion) {
              window.history.replaceState({}, "", currentPath + window.location.hash);
            }
          });
        </script>

execute:
  freeze: auto
