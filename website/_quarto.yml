project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research.qmd
    - people.qmd
    - publications.qmd
    - contact.qmd
  resources:
    - assets

website:
  title: "PACE Lab"
  description: "Pathogens, Animal Movement, Changes, and Ecology"
  favicon: assets/favicon.svg
  navbar:
    logo: assets/logo-concepts/pace-logo-official.png
    logo-alt: "PACE Lab logo"
    title: "PACE Lab"
    background: "#fffdf7"
    foreground: "#171716"
    search: false
    right:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "People"
        href: people.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Contact"
        href: contact.qmd
  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css: pace-site.css
    toc: false
    highlight-style: none
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#171716">

execute:
  freeze: auto
