project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research.qmd
    - people.qmd
    - publications.qmd
    - contact.qmd
  resources:
    - assets
    - navigation-stability-v2.css

website:
  title: "PACE Lab"
  description: "Pathogens, Animal Movement, Changes, and Ecology"
  favicon: assets/favicon.svg
  navbar:
    headroom: false
    logo: assets/logo-concepts/pace-logo-official-v2.png
    logo-alt: "PACE Lab logo"
    title: "PACE Lab"
    background: "#fffdf7"
    foreground: "#171716"
    search: false
    right:
      - text: "Home"
        href: index.html?v=nav-20260925-7
      - text: "Research"
        href: research.html?v=nav-20260925-7
      - text: "Team"
        href: people.html?v=nav-20260925-7
      - text: "Pubs"
        href: publications.html?v=nav-20260925-7
      - text: "Contact"
        href: contact.html?v=nav-20260925-7
  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css:
      - pace-site.css
      - navigation-stability-v3.css
    toc: false
    highlight-style: none
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#171716">
        <style>
          html.pace-zh-pending { background: #fffdf7; }
          html.pace-zh-pending body { visibility: hidden; }
        </style>
        <script>
          (function () {
            const requested = new URLSearchParams(window.location.search).get("lang");
            const isHome = window.location.pathname === "/" ||
              window.location.pathname.endsWith("/index.html");
            let needsChinese = requested === "zh";
            if (!requested && !isHome) {
              try { needsChinese = window.localStorage.getItem("pace-language") === "zh"; } catch (_) {}
            }
            if (needsChinese) {
              document.documentElement.classList.add("pace-zh-pending");
              window.setTimeout(function () {
                document.documentElement.classList.remove("pace-zh-pending");
              }, 5000);
            }
          })();
        </script>
        <script defer src="assets/js/language-switch.js?v=zh-no-flash-20260925"></script>
        <script>
          window.addEventListener("DOMContentLoaded", function () {
            const navigationVersion = "nav-20260925-7";
            const normalizePath = function (path) {
              return path.endsWith("/index.html")
                ? path.slice(0, -"index.html".length)
                : path;
            };
            const currentPath = normalizePath(window.location.pathname);

            document.querySelectorAll(".navbar-nav .nav-link").forEach(function (link) {
              const linkPath = normalizePath(new URL(link.href, window.location.origin).pathname);
              const isCurrentPage = linkPath === currentPath;
              link.classList.toggle("active", isCurrentPage);
              if (isCurrentPage) {
                link.setAttribute("aria-current", "page");
              } else {
                link.removeAttribute("aria-current");
              }
            });

            if (new URLSearchParams(window.location.search).get("v") === navigationVersion) {
              const cleanUrl = new URL(window.location.href);
              cleanUrl.searchParams.delete("v");
              window.history.replaceState({}, "", currentPath + cleanUrl.search + cleanUrl.hash);
            }
          });
        </script>

execute:
  freeze: auto
